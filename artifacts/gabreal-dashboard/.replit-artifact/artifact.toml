kind = "web"
previewPath = "/"
title = "Gabreal Command Center"
version = "1.0.0"
id = "artifacts/gabreal-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20979

[services.development]
run = "pnpm --filter @workspace/gabreal-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gabreal-dashboard", "run", "build" ]
publicDir = "artifacts/gabreal-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20979"
BASE_PATH = "/"
